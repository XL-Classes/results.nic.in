    <style>
        :root {
            --bg: #0b0f14;
            --panel: #0f1620;
            --muted: #1b2430;
            --text: #e5e7eb;
            --text-dim: #a3b1c6;
            --accent: #7c3aed;
            --accent-2: #14b8a6;
            --border: #1f2937;
            --ring: #2563eb;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            --radius: 14px;
            --speed: 180ms;
        }

        html,
        body {
            background: radial-gradient(1200px 800px at 10% -10%, rgba(124, 58, 237, .12), transparent 60%),
                radial-gradient(1000px 700px at 90% 10%, rgba(20, 184, 166, .10), transparent 60%),
                var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-light {
            background-color: var(--panel) !important;
        }

        .custom-navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
            background: rgba(15, 22, 32, .7) !important;
            backdrop-filter: blur(10px) saturate(120%);
            border-bottom: 1px solid var(--border);
        }

        .custom-navbar .navbar-brand {
            color: var(--text) !important;
            letter-spacing: .4px;
        }

        .custom-navbar .nav-link {
            color: var(--text-dim) !important;
            position: relative;
            padding-inline: clamp(.5rem, 1.2vw, .85rem);
            transition: color var(--speed) ease;
        }

        .custom-navbar .nav-link:hover,
        .custom-navbar .nav-link:focus {
            color: var(--text) !important;
        }

        .custom-navbar .nav-link::after {
            content: "";
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: 6px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--speed) ease;
            border-radius: 2px;
        }

        .custom-navbar .nav-link:hover::after,
        .custom-navbar .nav-link:focus::after {
            transform: scaleX(1);
        }

        .navbar-toggler {
            border-color: var(--border) !important;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .35);
        }

        .dropdown-menu {
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .dropdown-item {
            color: var(--text-dim);
            transition: background var(--speed), color var(--speed);
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background: var(--muted);
            color: var(--text);
        }

        .container {
            max-width: min(1200px, 92vw);
        }

        section.container.my-5 {
            margin-block: clamp(1.5rem, 4vw, 3rem) !important;
        }

        h2 {
            color: var(--text);
        }

        .gallery-toolbar {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .toolbar-chip {
            border: 1px solid var(--border);
            color: var(--text);
            background: rgba(255, 255, 255, .03);
            border-radius: 999px;
            padding: .5rem .9rem;
            transition: background var(--speed) ease, border-color var(--speed) ease, transform var(--speed) ease;
            box-shadow: var(--shadow);
        }

        .toolbar-chip:hover,
        .toolbar-chip:focus {
            background: rgba(124, 58, 237, .12);
            border-color: rgba(124, 58, 237, .45);
            transform: translateY(-1px);
        }

        .gallery-img {
            width: 100%;
            height: 200px;
            /* fix ek hi height */
            object-fit: cover;
            /* crop karega neatly */
            cursor: pointer;
            transition: transform var(--speed) ease, box-shadow var(--speed) ease, filter var(--speed) ease;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .gallery-img:hover {
            transform: translateY(-3px) scale(1.02);
            filter: saturate(1.05);
        }

        .card-like {
            background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .pagination .page-link {
            background: rgba(255, 255, 255, .03);
            border-color: var(--border);
            color: var(--text);
            transition: background var(--speed) ease, color var(--speed) ease, transform var(--speed) ease;
            border-radius: 10px;
        }

        .pagination .page-item.active .page-link {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-color: transparent;
            color: #0b1220;
        }

        .pagination .page-link:hover {
            transform: translateY(-1px);
            background: rgba(124, 58, 237, .12);
        }

        .pagination .page-item.disabled .page-link {
            opacity: .5;
        }

        .modal-content.bg-dark {
            background: #0a0f15 !important;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .btn {
            border-radius: var(--radius);
            transition: transform var(--speed) ease, box-shadow var(--speed) ease, background var(--speed) ease, border-color var(--speed) ease;
        }

        .btn-light {
            color: var(--text);
            background: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .06));
            border: 1px solid var(--border);
        }

        .btn-light:hover {
            transform: translateY(-1px);
        }

        footer.bg-dark {
            background: #0a0f15 !important;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--text-dim) !important;
        }

        footer a:hover {

        footer .d-flex.justify-content-center a {

            align-items: center;

            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .02);
            transition: transform var(--speed) ease, border-color var(--speed) ease, background var(--speed) ease;
        }

        footer .d-flex.justify-content-center a:hover {
            transform: translateY(-2px);
            background: rgba(124, 58, 237, .12);
            border-color: rgba(124, 58, 237, .45);
        }

        #backToTop {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1040;
            display: none;
            padding: .75rem 1rem;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border: none;
            color: #0b1220;
            font-weight: 700;
            border-radius: 999px;
            box-shadow: var(--shadow);
        }

        #backToTop:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        @media (max-width: 991.98px) {
            .custom-navbar .navbar-collapse {
                background: rgba(15, 22, 32, .95);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: .75rem;
                margin-top: .5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const itemsPerPage = 12;
            const gallery = document.querySelectorAll("#photoGallery .col-6");
            const totalItems = gallery.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const pagination = document.getElementById("pagination");
            let currentPage = 1;

            function showPage(page) {
                gallery.forEach((item, index) => {
                    item.style.display =
                        index >= (page - 1) * itemsPerPage && index < page * itemsPerPage
                            ? "block"
                            : "none";
                });

                // Active button update
                document.querySelectorAll("#pagination .page-item").forEach((btn) => {
                    btn.classList.remove("active");
                });
                const btns = pagination.querySelectorAll(".page-item");
                if (btns[page]) btns[page].classList.add("active");

                // Prev/Next disable handling
                btns[0].classList.toggle("disabled", page === 1);
                btns[totalPages + 1].classList.toggle("disabled", page === totalPages);
            }

            // Pagination buttons create
            pagination.innerHTML = `
      <li class="page-item"><a class="page-link" href="#">«</a></li>
    `;
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `
        <li class="page-item"><a class="page-link" href="#">${i}</a></li>
      `;
            }
            pagination.innerHTML += `
      <li class="page-item"><a class="page-link" href="#">»</a></li>
    `;

            // Buttons events
            const buttons = pagination.querySelectorAll(".page-item");
            buttons.forEach((btn, index) => {
                btn.addEventListener("click", (e) => {
                    e.preventDefault();
                    if (btn.classList.contains("disabled")) return;

                    if (btn.textContent === "«") currentPage = Math.max(1, currentPage - 1);
                    else if (btn.textContent === "»") currentPage = Math.min(totalPages, currentPage + 1);
                    else currentPage = parseInt(btn.textContent);

                    showPage(currentPage);
                });
            });

            // First render
            showPage(currentPage);
        });

        // Back to top
        const btt = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            btt.style.display = window.scrollY > 300 ? 'block' : 'none';
        });
        btt.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
